receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Prometheus scraping endpoint — Prometheus polls this port
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: ""          # keep metric names as-is (no extra prefix)
    send_timestamps: false
    enable_open_metrics: false

  # Tempo receives traces via OTLP
  otlp/tempo:
    endpoint: http://tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
